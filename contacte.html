		    <script>
    // Esperem que el DOM estigui carregat
    document.addEventListener('DOMContentLoaded', function() {
        
        // Seleccionem el botó pel seu ID
        var boton = document.getElementById('whatsappBtn');
        
        // Afegim l'esdeveniment de clic
        boton.addEventListener('click', function(event) {
            
            // Evitem que s'enviï cap formulari (comportament per defecte de type="submit")
            event.preventDefault();
            
            // Obrim l'API de WhatsApp en una pestanya nova
            window.open('https://api.whatsapp.com/send?phone=34615910992', '_blank');
            
            // Si el vols obrir a la mateixa pestanya, substitueix per:
            // window.location.href = 'https://api.whatsapp.com/send?phone=34615910992';
