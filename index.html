<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Més Que Pa</title>
  <style>
    :root {
      --bg: #f9f9f9;
      --text: #333;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --green: #0a6e3a;
      --red: #b52b16;
      --yellow: #cca300;
      --shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; background: #fff; box-shadow: var(--shadow);
      position: sticky; top: 0; z-index: 100;
    }
    .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-area img { height: 40px; width: auto; }
    .logo-text { font-weight: 300; letter-spacing: 2px; font-size: 14px; }
    .controls { display: flex; gap: 15px; align-items: center; }
    .lang-btn { background: none; border: 1px solid #ccc; padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 14px; }

    .breadcrumb {
      padding: 15px 20px; font-size: 13px; color: #777;
      background: #f1f1f1; display: none; flex-wrap: wrap; gap: 5px;
    }
    .breadcrumb.show { display: flex; }
    .breadcrumb span { cursor: pointer; }
    .breadcrumb span:hover { color: var(--text); text-decoration: underline; }
    .breadcrumb .sep { cursor: default; margin: 0 5px; }
    .breadcrumb .sep:hover { text-decoration: none; color: #777; }

    main { max-width: 1000px; margin: 40px auto; padding: 0 20px; }

    .landing-grid {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 30px;
      margin-top: 50px;
    }
    .circle-btn {
      width: 250px; height: 250px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; letter-spacing: 1px; text-align: center;
      cursor: pointer; box-shadow: var(--shadow); transition: transform 0.3s, box-shadow 0.3s;
      border: none; outline: none; padding: 20px; position: relative;
    }
    .circle-btn:hover { transform: scale(1.05); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .circle-pa { background-color: var(--green); }
    .circle-probiotics { background-color: var(--red); }
    .circle-artesanies { background-color: var(--yellow); color: #fff; }

    .list-title { text-align: center; font-size: 24px; font-weight: 300; margin-bottom: 30px; letter-spacing: 1px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;
    }
    .card {
      background: #fff; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow);
      transition: transform 0.2s; cursor: pointer; position: relative;
    }
    .card:hover { transform: translateY(-5px); }
    .card-img {
      height: 150px; background: #eee; width: 100%; object-fit: cover; display: block;
    }
    .card-placeholder {
      height: 150px; background: #eee; width: 100%; display: flex; align-items: center; justify-content: center;
      color: #aaa; font-size: 13px; letter-spacing: 1px;
    }
    .card-content { padding: 15px; }
    .card-title { font-size: 18px; margin-bottom: 5px; }
    .card-price { font-weight: bold; color: var(--text); font-size: 16px; margin-top: 10px; }

    .product-view {
      display: flex; gap: 40px; background: #fff; padding: 30px; border-radius: 10px; box-shadow: var(--shadow); flex-wrap: wrap;
      position: relative;
    }
    .product-img { flex: 1; min-width: 250px; max-width: 400px; height: auto; border-radius: 10px; object-fit: cover; }
    .product-placeholder {
      flex: 1; min-width: 250px; max-width: 400px; height: 300px; border-radius: 10px;
      background: #eee; display: flex; align-items: center; justify-content: center; color: #aaa;
    }
    .product-info { flex: 2; min-width: 250px; }
    .product-info h1 { font-size: 28px; font-weight: 400; margin-bottom: 10px; }
    .product-info .price { font-size: 24px; color: var(--green); font-weight: bold; margin-bottom: 20px; }
    .product-info .desc { font-size: 16px; margin-bottom: 20px; }
    .product-info .ingredients { font-size: 14px; color: #666; background: #f9f9f9; padding: 15px; border-radius: 8px; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff; padding: 30px; border-radius: 10px; width: 100%; max-width: 500px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin-bottom: 20px; font-weight: 500; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #555; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-secondary { background: #eee; color: #333; }
    .btn-danger { background: var(--red); color: #fff; }

    .admin-bar { background: #000; color: #fff; text-align: center; padding: 10px; font-size: 14px; display: none; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
    .admin-bar.show { display: flex; }
    .admin-bar button {
      background: var(--green); color: #fff; border: none; padding: 5px 10px; border-radius: 4px;
      cursor: pointer; font-size: 13px;
    }
    .admin-bar button.danger { background: var(--red); }
    .admin-bar button.neutral { background: #555; }
    .admin-edit-btn {
      position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9);
      border: 1px solid #ccc; border-radius: 50%; width: 30px; height: 30px;
      display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 10;
      font-size: 14px;
    }
    .admin-edit-btn:hover { background: #fff; }
    body.is-admin .admin-edit-btn { display: flex; }
    .add-btn {
      display: none; margin: 20px auto; padding: 10px 20px; background: var(--green); color: #fff;
      border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    body.is-admin .add-btn { display: block; }

    .loading { text-align: center; padding: 60px 20px; color: #777; }
    .error-box { text-align: center; padding: 60px 20px; color: var(--red); }
    .error-box small { color: #777; }

    @media (max-width: 600px) {
      .circle-btn { width: 200px; height: 200px; font-size: 14px; }
      .product-view { flex-direction: column; }
    }
  </style>
</head>

          "name": { "ca": "Altres Conserves", "en": "Other Preserves" },
          "desc": { "ca": "Conserves artesanes de temporada.", "en": "Seasonal artisan preserves." },
          "price": "", "image": "",
          "ingredients": { "ca": "Fruita o verdura de temporada, sucre, vinagre i espècies.", "en": "Seasonal fruit or vegetables, sugar, vinegar and spices." }
        }
      }
    }
  }
}
  </script>

  <script>
    /* =========================================
       1. ESTAT I CONFIGURACIÓ
    ========================================= */
    let data = null;
    let currentPath = [];
    let lang = 'ca';
    let isAdmin = false;
    let isLoading = true;
    const ADMIN_PASSWORD = "admin123";
    const STORAGE_KEY = "mesquepa_data";

    /* =========================================
       2. CARREGAR DADES
    ========================================= */
    async function loadData() {
      let baseData = null;
      
      // 1. Intentem carregar db.json (funciona a GitHub Pages i servidors locals)
      try {
        const res = await fetch('db.json', { cache: 'no-store' });
        if (res.ok) {
          baseData = await res.json();
        }
      } catch (e) {
        console.warn('No s\'ha pogut fer fetch de db.json. Fent servir les dades integrades.', e);
      }

      // 2. Si falla (ex: obert en local a Android), usem el JSON incrustat
      if (!baseData) {
        const embedded = document.getElementById('embedded-db');
        if (embedded) {
          try {
            baseData = JSON.parse(embedded.textContent);
          } catch (e) {
            console.error('Error al llegir el JSON incrustat', e);
          }
        }
      }

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          data = JSON.parse(saved);
        } catch (e) {
          data = baseData;
          localStorage.removeItem(STORAGE_KEY);
        }
      } else {
        data = baseData;
      }

      isLoading = false;

      if (!data) {
        document.getElementById('app').innerHTML =
          '<div class="error-box">No s\'ha pogut carregar la base de dades.<br>' +
          'Comprova que <strong>db.json</strong> és a la mateixa carpeta o que el JSON incrustat és correcte.</div>';
        return;
      }

      render();
    }

    /* =========================================
       3. NAVEGACIÓ I RENDERITZAT
    ========================================= */
    function getCurrentNode() {
      if (!data) return null;
      let node = data;
      for (let id of currentPath) {
        if (node.children && node.children[id]) {
          node = node.children[id];
        } else {
          return null;
        }
      }
      return node;
    }

    function navigate(pathArray) {
      currentPath = pathArray;
      render();
      window.scrollTo(0, 0);
    }

    function toggleLang() {
      lang = lang === 'ca' ? 'en' : 'ca';
      document.getElementById('langBtn').innerText = lang === 'ca' ? '🇦🇩 CAT' : '🇬🇧 ENG';
      render();
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      if (!data || currentPath.length === 0) {
        bc.classList.remove('show');
        bc.innerHTML = '';
        return;
      }
      bc.classList.add('show');
      let html = '<span onclick="navigate([])">' + (lang === 'ca' ? 'Inici' : 'Home') + '</span>';
      let tempPath = [];
      let tempNode = data;

      for (let id of currentPath) {
        tempPath.push(id);
        tempNode = tempNode.children[id];
        if (!tempNode) break;
        html += ' <span class="sep">/</span> ';
        html += '<span onclick=\'navigate(' + JSON.stringify(tempPath) + ')\'>' +
          escapeHtml(tempNode.name[lang]) + '</span>';
      }
      bc.innerHTML = html;
    }

    function render() {
      const app = document.getElementById('app');
      if (isLoading) {
        app.innerHTML = '<div class="loading">Carregant dades...</div>';
        return;
      }
      if (!data) return;

      const node = getCurrentNode();
      renderBreadcrumb();

      if (!node) {
        app.innerHTML = '<div class="error-box">No trobat</div>';
        return;
      }

      /* LANDING: 3 CERCLES */
      if (node.type === 'root') {
        let html = '<div class="landing-grid">';
        const colors = { 'pa': 'circle-pa', 'probiotics': 'circle-probiotics', 'artesanies': 'circle-artesanies' };
        for (let key in node.children) {
          let child = node.children[key];
          html += '<button class="circle-btn ' + (colors[key] || '') + '" onclick=\'navigate(' +
            JSON.stringify([key]) + ')\'>' +
            '<span>' + escapeHtml(child.name[lang]) + '</span>' +
            '</button>';
        }
        html += '</div>';
        app.innerHTML = html;
        return;
      }

      /* CATEGORIES I SUBCATEGORIES */
      if (node.type === 'category' || node.type === 'subcategory') {
        let html = '<h1 class="list-title">' + escapeHtml(node.name[lang]) + '</h1>';
        html += '<div class="grid">';
        for (let key in node.children) {
          let child = node.children[key];
          let hasImg = child.type === 'product' && child.image;
          let pathToChild = JSON.stringify([...currentPath, key]);
          html += '<div class="card" onclick=\'navigate(' + pathToChild + ')\'>';
          html += '<button class="admin-edit-btn" onclick=\'event.stopPropagation(); openEditModal(' +
            JSON.stringify(key) + ')\' title="Editar">✏️</button>';
          if (hasImg) {
            html += '<img class="card-img" src="' + escapeAttr(child.image) + '" alt="' +
              escapeAttr(child.name[lang]) + '" onerror="this.style.display=\'none\'">';
          } else {
            html += '<div class="card-placeholder">Més Que Pa</div>';
          }
          html += '<div class="card-content">';
          html += '<div class="card-title">' + escapeHtml(child.name[lang]) + '</div>';
          if (child.type === 'product' && child.price) {
            html += '<div class="card-price">' + escapeHtml(child.price) + ' €</div>';
          }
          html += '</div></div>';
        }
        html += '</div>';
        if (isAdmin) {
          const typeToAdd = node.type === 'category' ? 'subcategory' : 'product';
          html += '<button class="add-btn" onclick=\'openAddModal(' + JSON.stringify(typeToAdd) +
            ')\'>+ Afegir ' + (typeToAdd === 'subcategory' ? 'Subcategoria' : 'Producte') + '</button>';
        }
        app.innerHTML = html;
        return;
      }

      /* PRODUCTE */
      if (node.type === 'product') {
        let html = '<div class="product-view">';
        html += '<button class="admin-edit-btn" onclick=\'openEditModal(' + JSON.stringify(node.id) +
          ', true)\' title="Editar">✏️</button>';
        if (node.image) {
          html += '<img class="product-img" src="' + escapeAttr(node.image) + '" alt="' +
            escapeAttr(node.name[lang]) + '" onerror="this.style.display=\'none\'">';
        } else {
          html += '<div class="product-placeholder">Més Que Pa</div>';
        }
        html += '<div class="product-info">';
        html += '<h1>' + escapeHtml(node.name[lang]) + '</h1>';
        html += '<div class="price">' + escapeHtml(node.price || '0.00') + ' €</div>';
        html += '<div class="desc">' + escapeHtml(node.desc ? node.desc[lang] : '') + '</div>';
        html += '<div class="ingredients"><strong>Ingredients:</strong><br>' +
          escapeHtml(node.ingredients ? node.ingredients[lang] : '-') + '</div>';
        html += '</div></div>';
        app.innerHTML = html;
        return;
      }
    }

    /* =========================================
       4. ADMIN
    ========================================= */
    function tryAdminLogin() {
      if (isAdmin) return;
      let pwd = prompt("Introdueix la contrasenya d'administrador:");
      if (pwd === ADMIN_PASSWORD) {
        isAdmin = true;
        document.body.classList.add('is-admin');
        document.getElementById('adminBar').classList.add('show');
        render();
      } else if (pwd !== null) {
        alert("Contrasenya incorrecta.");
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      document.body.classList.remove('is-admin');
      document.getElementById('adminBar').classList.remove('show');
      render();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      render();
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'db.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          data = imported;
          saveData();
          alert('db.json importat correctament.');
        } catch (err) {
          alert('El fitxer no és un JSON vàlid.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    async function restoreFromDb() {
      try {
        const res = await fetch('db.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('No s\'ha pogut llegir db.json');
        data = await res.json();
        localStorage.removeItem(STORAGE_KEY);
        render();
        alert('S\'ha restaurat db.json i s\'han eliminat els canvis locals.');
      } catch (e) {
        alert('Error restaurant db.json (si estàs en local, no funciona). Fes servir "Importar db.json".');
      }
    }

    function openAddModal(typeToAdd) {
      const modal = document.getElementById('modalOverlay');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <h3>Nou element</h3>
        <div class="form-group">
          <label>Nom (Català)</label>
          <input type="text" id="f-name-ca">
        </div>
        <div class="form-group">
          <label>Nom (Anglès)</label>
          <input type="text" id="f-name-en">
        </div>
        ${typeToAdd === 'product' ? `
          <div class="form-group">
            <label>Preu (€)</label>
            <input type="text" id="f-price">
          </div>
          <div class="form-group">
            <label>URL Imatge</label>
            <input type="text" id="f-image">
          </div>
          <div class="form-group">
            <label>Descripció (CA)</label>
            <textarea id="f-desc-ca"></textarea>
          </div>
          <div class="form-group">
            <label>Descripció (EN)</label>
            <textarea id="f-desc-en"></textarea>
          </div>
          <div class="form-group">
            <label>Ingredients (CA)</label>
            <textarea id="f-ing-ca"></textarea>
          </div>
          <div class="form-group">
            <label>Ingredients (EN)</label>
            <textarea id="f-ing-en"></textarea>
          </div>
        ` : ''}
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel·lar</button>
          <button class="btn btn-primary" onclick='saveNewItem(${JSON.stringify(typeToAdd)})'>Guardar</button>
        </div>
      `;
      modal.classList.add('show');
    }

    function openEditModal(id, isProductView = false) {
      const node = getCurrentNode();
      if (!node) return;
      const item = isProductView ? node : node.children[id];
      if (!item) return;
      const modal = document.getElementById('modalOverlay');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <h3>Editar: ${escapeHtml(item.name.ca)}</h3>
        <div class="form-group">
          <label>Nom (Català)</label>
          <input type="text" id="f-name-ca" value="${escapeAttr(item.name.ca)}">
        </div>
        <div class="form-group">
          <label>Nom (Anglès)</label>
          <input type="text" id="f-name-en" value="${escapeAttr(item.name.en)}">
        </div>
        ${item.type === 'product' ? `
          <div class="form-group">
            <label>Preu (€)</label>
            <input type="text" id="f-price" value="${escapeAttr(item.price || '')}">
          </div>
          <div class="form-group">
            <label>URL Imatge</label>
            <input type="text" id="f-image" value="${escapeAttr(item.image || '')}">
          </div>
          <div class="form-group">
            <label>Descripció (CA)</label>
            <textarea id="f-desc-ca">${escapeHtml(item.desc ? item.desc.ca : '')}</textarea>
          </div>
          <div class="form-group">
            <label>Descripció (EN)</label>
            <textarea id="f-desc-en">${escapeHtml(item.desc ? item.desc.en : '')}</textarea>
          </div>
          <div class="form-group">
            <label>Ingredients (CA)</label>
            <textarea id="f-ing-ca">${escapeHtml(item.ingredients ? item.ingredients.ca : '')}</textarea>
          </div>
          <div class="form-group">
            <label>Ingredients (EN)</label>
            <textarea id="f-ing-en">${escapeHtml(item.ingredients ? item.ingredients.en : '')}</textarea>
          </div>
        ` : ''}
        <div class="modal-actions">
          ${item.type !== 'root' ? `
            <button class="btn btn-danger" onclick='deleteItem(${JSON.stringify(id)}, ${isProductView})'>Esborrar</button>
          ` : ''}
          <button class="btn btn-secondary" onclick="closeModal()">Cancel·lar</button>
          <button class="btn btn-primary" onclick='updateItem(${JSON.stringify(id)}, ${isProductView})'>Guardar canvis</button>
        </div>
      `;
      modal.classList.add('show');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    function getFormData() {
      const d = {
        name: {
          ca: document.getElementById('f-name-ca').value,
          en: document.getElementById('f-name-en').value
        }
      };
      if (document.getElementById('f-price')) {
        d.price = document.getElementById('f-price').value;
        d.image = document.getElementById('f-image').value;
        d.desc = {
          ca: document.getElementById('f-desc-ca').value,
          en: document.getElementById('f-desc-en').value
        };
        d.ingredients = {
          ca: document.getElementById('f-ing-ca').value,
          en: document.getElementById('f-ing-en').value
        };
      }
      return d;
    }

    function saveNewItem(type) {
      const node = getCurrentNode();
      if (!node) return;
      const formData = getFormData();

      if (!formData.name.ca.trim()) {
        alert('El nom en català és obligatori.');
        return;
      }

      const baseId = formData.name.ca
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');
      const newId = (baseId || 'item') + Date.now().toString().slice(-4);

      if (type === 'subcategory') {
        node.children[newId] = {
          id: newId,
          type: 'subcategory',
          name: formData.name,
          children: {}
        };
      } else {
        node.children[newId] = {
          id: newId,
          type: 'product',
          name: formData.name,
          price: formData.price || '',
          image: formData.image || '',
          desc: formData.desc,
          ingredients: formData.ingredients
        };
      }

      saveData();
      closeModal();
    }

    function updateItem(id, isProductView) {
      const node = getCurrentNode();
      if (!node) return;
      const item = isProductView ? node : node.children[id];
      if (!item) return;
      const formData = getFormData();

      if (!formData.name.ca.trim()) {
        alert('El nom en català és obligatori.');
        return;
      }

      item.name = formData.name;
      if (item.type === 'product') {
        item.price = formData.price;
        item.image = formData.image;
        item.desc = formData.desc;
        item.ingredients = formData.ingredients;
      }

      saveData();
      closeModal();
    }

    function deleteItem(id, isProductView) {
      if (!confirm("Segur que vols esborrar aquest element?")) return;

      if (isProductView) {
        const parentPath = currentPath.slice(0, -1);
        let parentNode = data;
        for (let i = 0; i < parentPath.length; i++) {
          parentNode = parentNode.children[parentPath[i]];
        }
        if (parentNode && parentNode.children) {
          delete parentNode.children[id];
        }
        saveData();
        closeModal();
        navigate(parentPath);
      } else {
        const node = getCurrentNode();
        if (node && node.children) {
          delete node.children[id];
        }
        saveData();
        closeModal();
      }
    }

    /* =========================================
       5. UTILITATS
    ========================================= */
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function escapeAttr(s) {
      return escapeHtml(s);
    }

    /* =========================================
       6. INICIALITZACIÓ
    ========================================= */
    loadData();
  </script>
</body>
</html>
